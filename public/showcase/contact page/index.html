<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mateus Celestino Fotografia</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter para um visual "Apple-like" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Garante que fique em apenas uma dobra */
            background-color: #000; /* Fundo preto caso as imagens demorem a carregar */
        }

        /* Efeito Apple-like (Glassmorphism) para os botões */
        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .glass-button:active {
            transform: scale(0.98);
        }

        /* Transição suave para o background */
        .bg-slide {
            transition: opacity 1.5s ease-in-out;
        }

        /* Animação de entrada da página */
        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="text-white h-[100dvh] w-full relative flex flex-col items-center justify-center">

    <!-- Background Slider Container -->
    <div id="bg-container" class="absolute inset-0 w-full h-full z-0 pointer-events-none">
        <!-- As imagens serão injetadas aqui via JavaScript -->
    </div>

    <!-- Filtro de leve escurecimento (Dark Overlay) -->
    <div class="absolute inset-0 w-full h-full z-0 bg-black/60 pointer-events-none"></div>

    <!-- Main Content (Z-10 para ficar acima do fundo) -->
    <main class="relative z-10 flex flex-col items-center w-full max-w-md px-6 fade-in-up">
        
        <!-- Foto de Perfil -->
        <div class="mb-6 relative">
            <div class="w-24 h-24 rounded-full p-[2px] bg-gradient-to-tr from-white/20 to-white/50 backdrop-blur-sm shadow-2xl">
                <!-- Usando KZ.JPG conforme solicitado. Fallback incluído para preview caso a imagem não seja encontrada -->
                <img src="KZ.JPG" onerror="this.src='https://placehold.co/200x200/222/FFF?text=MC'" alt="Mateus Celestino" class="w-full h-full object-cover rounded-full">
            </div>
        </div>

        <!-- Título -->
        <h1 class="text-sm md:text-base font-light tracking-[0.3em] uppercase text-center mb-10 text-white/90">
            Mateus Celestino<br>
            <span class="text-xs tracking-[0.4em] text-white/60 mt-1 block">Fotografia</span>
        </h1>

        <!-- Links / Botões -->
        <div class="w-full flex flex-col gap-4">
            
            <!-- Site -->
            <a href="https://photografy-home.vercel.app" target="_blank" class="glass-button w-full py-4 px-6 rounded-2xl flex items-center justify-center relative group">
                <span class="font-light tracking-wide text-sm">Meu Portfólio</span>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/mateusfotografiapro/" target="_blank" class="glass-button w-full py-4 px-6 rounded-2xl flex items-center justify-center relative group">
                <span class="font-light tracking-wide text-sm">Instagram</span>
            </a>

            <!-- WhatsApp (Formato padrão BR com o número fornecido) -->
            <a href="https://wa.me/5531998622489" target="_blank" class="glass-button w-full py-4 px-6 rounded-2xl flex items-center justify-center relative group">
                <span class="font-light tracking-wide text-sm">WhatsApp</span>
            </a>

            <!-- Email -->
            <a href="mailto:mateusgomes6667@gmail.com" class="glass-button w-full py-4 px-6 rounded-2xl flex items-center justify-center relative group">
                <span class="font-light tracking-wide text-sm">E-mail</span>
            </a>
            
        </div>
    </main>

    <script>
        // Array com os nomes exatos das imagens fornecidas no print
        const images = [
            'L1.jpg',
            'L2.jpg',
            'L3.png.jpg',
            'L4.png.jpg',
            'L5.png.jpg'
        ];

        const bgContainer = document.getElementById('bg-container');
        let currentIndex = 0;

        // Pré-carrega e inicializa as imagens no DOM
        function initBackgroundSlider() {
            images.forEach((src, index) => {
                const imgDiv = document.createElement('div');
                // Estilo absoluto cobrindo a tela, tamanho de capa, centralizado
                imgDiv.className = `absolute inset-0 bg-cover bg-center bg-no-repeat bg-slide ${index === 0 ? 'opacity-100' : 'opacity-0'}`;
                imgDiv.style.backgroundImage = `url('${src}')`;
                
                // Fallback para ambiente de teste/preview se as imagens locais não estiverem na mesma pasta (Muda para imagens abstratas escuras)
                const imgCheck = new Image();
                imgCheck.onerror = () => {
                    imgDiv.style.backgroundImage = `url('https://images.unsplash.com/photo-1542038784456-1ea8e935640e?q=80&w=2070&auto=format&fit=crop')`;
                };
                imgCheck.src = src;

                bgContainer.appendChild(imgDiv);
            });

            // Troca de imagem a cada 3 segundos (3000 ms) de forma suave
            setInterval(() => {
                const slides = bgContainer.children;
                
                // Esconde a atual
                slides[currentIndex].classList.remove('opacity-100');
                slides[currentIndex].classList.add('opacity-0');
                
                // Calcula a próxima
                currentIndex = (currentIndex + 1) % images.length;
                
                // Mostra a próxima
                slides[currentIndex].classList.remove('opacity-0');
                slides[currentIndex].classList.add('opacity-100');
                
            }, 3000);
        }

        // Inicia assim que o conteúdo carrega
        document.addEventListener('DOMContentLoaded', initBackgroundSlider);
    </script>
</body>
</html>
