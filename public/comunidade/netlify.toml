# ==========================================================================
# Netlify Configuration — A.I VISUALS Members Area
# Static site + Serverless Functions (Mercado Pago)
# ==========================================================================

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ─── SPA Redirect (não redirecionar as functions) ──────────────────────────
[[redirects]]
  from = "/.netlify/functions/*"
  to   = "/.netlify/functions/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# ─── Cache agressivo para imagens (1 ano) ──────────────────────────────────
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache suave para dados JSON (1 dia) ───────────────────────────────────
[[headers]]
  for = "/src/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Access-Control-Allow-Origin = "*"

# ─── Security Headers Globais ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-XSS-Protection           = "1; mode=block"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy    = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net https://sdk.mercadopago.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://wccrxgczldiviilkfsuj.supabase.co wss://wccrxgczldiviilkfsuj.supabase.co https://api.mercadopago.com https://api.dicebear.com; frame-src https://www.youtube.com https://player.vimeo.com https://www.mercadopago.com.br https://mercadopago.com.br; worker-src blob:;"
